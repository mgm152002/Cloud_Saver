AWSTemplateFormatVersion: '2010-09-09'

Description: CloudSaver AWS Onboarding

Parameters:
  ExternalId:
    Type: String
    Description: External ID generated by CloudSaver

Resources:
  CloudSaverReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudSaverReadOnlyRole

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: arn:aws:iam::634541169564:root
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId

      Policies:
        - PolicyName: CloudSaverReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:Describe*
                  - rds:Describe*
                  - elasticloadbalancing:Describe*
                  - elasticloadbalancingv2:Describe*
                  - lambda:List*
                  - lambda:Get*
                  - s3:List*
                  - s3:GetBucketLocation
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:GetMetricData
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - ce:GetCostAndUsageWithResources
                Resource: '*'

        - PolicyName: CloudSaverRemediation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:StopInstances
                  - ec2:StartInstances
                  - ec2:ModifyInstanceAttribute
                  - ec2:CreateSnapshot
                  - ec2:DeleteVolume
                  - rds:CreateDBSnapshot
                  - rds:ModifyDBInstance
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancingv2:DeleteLoadBalancer
                  - lambda:UpdateFunctionConfiguration
                  - lambda:DeleteFunction
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketLifecycleConfiguration
                Resource: '*'

Outputs:
  RoleArn:
    Value: !GetAtt CloudSaverReadOnlyRole.Arn
